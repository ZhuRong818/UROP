[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventx"
version = "0.0.1"
description = "EventX — a leakage-safe benchmark for incremental social-media information in prediction-market price discovery"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Installed as later phases need them; kept out of the Phase 0 core install.
data = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15"]
models = ["scikit-learn>=1.4", "lightgbm>=4.3", "statsmodels>=0.14"]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["eventx*"]

[tool.ruff]
line-length = 100
target-version = "py312"
