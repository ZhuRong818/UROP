# EventX frozen-extract config. Pin this per extract version; downstream work runs
# against the frozen copy, never live calls (guardrail A3).

extract:
  version: "v0"            # bump on every re-pull; recorded in meta.extract_version
  # config_hash + row_counts are written by the ingest job, not by hand.

api:
  base_url_env: FINDATA_BASE_URL   # value lives in .env, not here
  token_env: FINDATA_TOKEN
  rpm: 90                  # stay under the 100 req/min cap with headroom

db:
  # Connection comes from env (PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD); see .env.
  schemas: [raw, curated, meta]

# Data availability — VERIFIED against the live API 2026-07-04 + developer-confirmed
# archive floors (guardrail C7). `interval` is integer MINUTES (1|5|15|60|1440), not 1m/1h.
# The API retains individual TRADES for only a recent rolling window (~6 weeks); older
# intraday data exists ONLY as candles, and Polymarket candle depth is interval-dependent.
#   * Polymarket trades: hard retention wall ~2026-05-21 (`to` cursor works; older = ZERO).
#   * Kalshi trades: no trades reachable before 2025 on any current-universe market.
#   * Polymarket candle floors: daily(1440) from 2024-01-02; 15 & 60 only from 2025-12-05
#     (60m floor independently verified); 1/5 recent-only + row-capped at 5000. So for any
#     Polymarket market older than ~Dec 2025, ONLY interval=1440 returns rows.
#   * Kalshi candles: all intervals back to 2021-06 (far richer than Polymarket).
# Granularity seam is ASYMMETRIC: Polymarket daily-only pre-Dec-2025, Kalshi full-res to 2021.
# Still-open blocker: enumerating old RESOLVED market IDs (lqt = current-active only;
# markets/search broken; lakehouse browse tool unreachable) — needed before any historical spine.
data_availability:
  trade_retention_wall_polymarket: "2026-05-21T00:00:00Z"   # earliest trade reachable; re-verify per pull
  historical_bar_source: candles                            # older windows have no trades; candles only
  candle_intervals_min: [1, 5, 15, 60, 1440]                # interval = integer minutes
  candle_row_cap: 5000                                      # observed cap on finer intervals
  polymarket_candle_floor:
    "1440": "2024-01-02"
    "60": "2025-12-05"
    "15": "2025-12-05"
    "1_5": recent_only
  kalshi_candle_floor_all_intervals: "2021-06-01"

# Study window — a dense 12–18-month span with simultaneous KOL+news+PM coverage.
# PROVISIONAL and CURRENTLY UNREALIZABLE AT TICK LEVEL: this span predates the trade
# retention wall, so tick-based bars do not exist for it. Pending user design decision —
# (A) forward-collect a tick window from now, (B) candle-based bars for this historical
# span, or (C) hybrid with a granularity seam. See guardrail C7.
window:
  start: "2024-01-01T00:00:00Z"
  end: "2025-06-30T23:59:59Z"

venues: [polymarket, kalshi]

# Bar reconstruction (guardrail C7/C8). Trades where retained, else candles (see
# data_availability). base_freq_min applies to the trade-reconstructed window; historical
# candle-sourced bars are limited to available candle intervals (60m+ for deep history).
bars:
  base_freq_min: 1
  logodds_clip_eps: 1.0e-4   # clip p to [eps, 1-eps] before ln(p/(1-p))
  price_source: midprice_then_last   # orderbook mid where L2 exists, else last trade
  historical_candle_interval_min: 60   # coarsest reliable deep-history bar (guardrail C7 seam)

# Jump labels (guardrail C8/C9) — calibrate on an early held-out slice, never the test period.
labels:
  horizons_min: [5, 30, 120, 360, 1440]   # 5m, 30m, 2h, 6h, 24h
  k_sigma: 4.0
  vol_window_bars: 240
  min_trades: 3
  min_notional: 100.0
  terminal_convergence_p: 0.98   # exclude bars once |p-0.5| implies p>=0.98 or <=0.02 and stays

# Purged + embargoed walk-forward CV (guardrail B5).
splits:
  n_splits: 5
  embargo_frac: 0.01
  # Final contiguous block held out untouched for headline numbers.
  holdout_frac: 0.2
